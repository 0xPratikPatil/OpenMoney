version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: openmoney-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openmoney
    ports:
      - "5432:5432"
    volumes:
      - openmoney-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openmoney"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openmoney-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - openmoney-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  openmoney-db-data:
  openmoney-redis-data:
